aid: 1worldonline
name: 1World Online
description: >-
  1World Online is an audience-engagement and interactive-advertising company, operating since 2012,
  that serves media publishers, advertisers and travel brands. Its platform embeds Interactive Media
  Units — polls, quizzes, trivia, debates and surveys — into publisher pages in 30+ languages, turns
  the resulting engagement into interactive ad inventory and first-party audience insight, and rewards
  participants through a points-based loyalty program and Web3 collectables (TravelVerse). The company
  also operates a technology center offering custom development and integration services. Its platform
  backend is live at app-wleu.1worldonline.com and serves the publisher portal, widget frontend and
  loyalty applications, but 1World Online publishes no public developer portal, API reference or
  machine-readable contract today, and the historic public Swagger UI host api.1worldonline.com no
  longer resolves.
