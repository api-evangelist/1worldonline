apis:
- aid: 1worldonline-platform
  name: 1World Platform API
  description: >-
    The first-party HTTP backend behind the 1World Online publisher portal, widget frontend and
    loyalty applications. Its host is declared by 1World Online's own frontend configuration
    (URL_SERVER_API_NEW) and confirmed by the Spring Boot Actuator index the host serves, whose
    self href names the same host. The surface is partner/tenant-facing: no public reference,
    OpenAPI, Swagger, GraphQL SDL or Postman collection is published, and every conventional
    spec path on the host returns 404.
  image: https://1worldonline.com/images/logo.svg
